<div>
  <h2 class="text-lg font-semibold text-slate-100 mb-4">Check access</h2>

  <form
    class="space-y-4"
    hx-get="/ui/debug/check/result"
    hx-target="#debug-check-result-panel"
    hx-swap="innerHTML"
  >
    <div>
      <label class="block text-sm text-slate-300 mb-1">User</label>
      <select
        name="user_id"
        class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        required
      >
        <option value="">Select user</option>
        {% for user in users %}
        <option
          value="{{ user.id }}"
          {% if prefill_user_id and prefill_user_id == user.id %}selected{% endif %}
        >
          {{ user.label }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Resource</label>
      <select
        name="resource_id"
        class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        required
      >
        <option value="">Select resource</option>
        {% for resource in resources %}
        <option
          value="{{ resource.id }}"
          {% if prefill_resource_id and prefill_resource_id == resource.id %}selected{% endif %}
        >
          {{ resource.label }}
        </option>
        {% endfor %}
      </select>
    </div>

    <button
      type="submit"
      class="w-full px-3 py-2 rounded-md bg-sky-600 text-white text-sm hover:bg-sky-500"
    >
      Evaluate
    </button>
  </form>
</div>
