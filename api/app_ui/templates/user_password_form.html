<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4">
  <div class="w-full max-w-xl rounded-xl border border-slate-800 bg-slate-900 shadow-2xl">
    <div class="flex items-start justify-between border-b border-slate-800 px-6 py-4">
      <div>
        <h2 class="text-lg font-semibold text-slate-100">Change Password</h2>
        <p class="mt-1 text-sm text-slate-400">
          Update password for <span class="text-slate-200">{{ user.username }}</span>.
        </p>
      </div>

      <button
        type="button"
        class="rounded-md px-3 py-1.5 text-sm text-slate-400 hover:bg-slate-800 hover:text-white"
        onclick="document.getElementById('modal-root').innerHTML='';"
      >
        Close
      </button>
    </div>

    <div id="user-password-error"></div>

    <form
      class="space-y-5 px-6 py-5"
      hx-post="{{ form_action }}"
      hx-target="#user-password-error"
      hx-swap="innerHTML"
      hx-target-422="#user-password-error"
      hx-target-404="#user-password-error"
      hx-on::after-request="if(event.detail.xhr.status < 400){ setTimeout(() => { document.getElementById('modal-root').innerHTML=''; }, 1200); }"
    >
      <div class="grid grid-cols-1 gap-4">
        <label class="block">
          <span class="mb-1 block text-sm text-slate-300">New password</span>
          <input
            type="password"
            name="new_password"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100 outline-none focus:border-cyan-500"
            placeholder="Minimum 8 characters"
            required
          />
        </label>

        <label class="block">
          <span class="mb-1 block text-sm text-slate-300">Confirm password</span>
          <input
            type="password"
            name="confirm_password"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100 outline-none focus:border-cyan-500"
            placeholder="Repeat new password"
            required
          />
        </label>
      </div>

      <div class="flex items-center justify-end gap-3 border-t border-slate-800 pt-4">
        <button
          type="button"
          class="rounded-lg border border-slate-700 px-4 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white"
          onclick="document.getElementById('modal-root').innerHTML='';"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500"
        >
          Update password
        </button>
      </div>
    </form>
  </div>
</div>
