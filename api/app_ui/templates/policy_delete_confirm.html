<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
  <div class="w-full max-w-md rounded-lg border border-rose-700 bg-slate-950 p-6 shadow-xl">
    <h3 class="text-lg font-semibold text-rose-200">Delete policy permanently?</h3>

    <p class="mt-3 text-sm text-slate-300">
      This action cannot be undone and may change effective access immediately.
    </p>

    <dl class="mt-4 space-y-2 rounded-md border border-slate-800 bg-slate-900/60 p-4 text-sm">
      <div class="flex justify-between gap-4">
        <dt class="text-slate-400">Policy</dt>
        <dd class="text-right font-medium text-slate-100">{{ policy.name }}</dd>
      </div>
      <div class="flex justify-between gap-4">
        <dt class="text-slate-400">Subject</dt>
        <dd class="text-right text-slate-200">{{ policy.subject }}</dd>
      </div>
      <div class="flex justify-between gap-4">
        <dt class="text-slate-400">Resource</dt>
        <dd class="text-right text-cyan-300">{{ policy.resource }}</dd>
      </div>
      <div class="flex justify-between gap-4">
        <dt class="text-slate-400">Effect / priority</dt>
        <dd class="text-right text-slate-200">{{ policy.effect }} / {{ policy.priority }}</dd>
      </div>
    </dl>

    <div class="mt-5 flex justify-end gap-3">
      <button
        type="button"
        class="rounded-md bg-slate-700 px-4 py-2 text-sm text-white hover:bg-slate-600"
        onclick="document.getElementById('modal-root').innerHTML=''"
      >
        Cancel
      </button>

      <button
        type="button"
        class="rounded-md bg-rose-700 px-4 py-2 text-sm font-medium text-white hover:bg-rose-600"
        hx-delete="/ui/policies/{{ policy.id }}?page={{ page }}&limit={{ limit }}&status={{ status }}"
        hx-target="#policies-table"
        hx-swap="innerHTML"
        hx-on::after-request="document.getElementById('modal-root').innerHTML=''"
      >
        Delete permanently
      </button>
    </div>
  </div>
</div>
