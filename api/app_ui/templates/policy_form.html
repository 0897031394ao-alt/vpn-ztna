<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4">
  <div class="w-full max-w-2xl max-h-[80vh] rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl flex flex-col">
    <div class="flex items-start justify-between border-b border-slate-800 px-6 py-5">
      <div>
        <h2 class="text-xl font-semibold text-slate-100">{{ form_title }}</h2>
        <p class="mt-1 text-sm text-slate-400">
          Bind users or groups to resources with allow/deny rules.
        </p>
      </div>
      <button
        type="button"
        class="text-sm text-slate-400 hover:text-slate-200"
        onclick="document.getElementById('modal-root').innerHTML='';"
      >
        Close
      </button>
    </div>

    {% set selected_subject_type = policy.subject_type if policy and policy.subject_type else "user" %}

    <div class="flex-1 overflow-y-auto px-6 py-6">
    <form
      class="space-y-4"
      hx-post="{{ form_action }}"
      hx-target="#policies-table"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.xhr.status < 400){ document.getElementById('modal-root').innerHTML=''; }"
    >
      <input type="hidden" name="page" value="{{ page or 1 }}">
      <input type="hidden" name="limit" value="{{ limit or 20 }}">
      <input type="hidden" name="status" value="{{ status or 'active' }}">

      {% if error_message %}
      <div class="rounded-lg border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200">
        {{ error_message }}
      </div>
      {% endif %}

      <div>
        <label class="block text-sm text-slate-300 mb-1">Name</label>
        <input
          type="text"
          name="name"
          value="{{ policy.name if policy else '' }}"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
          placeholder="Allow CRM for ops"
          required
        />
      </div>

      <div>
        <label class="block text-sm text-slate-300 mb-1">Description</label>
        <textarea
          name="description"
          rows="3"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
          placeholder="Optional description"
        >{{ policy.description if policy else '' }}</textarea>
      </div>

      <div>
        <label class="block text-sm text-slate-300 mb-1">Subject type</label>
        <select
          id="policy-subject-type"
          name="subject_type"
          onchange="togglePolicySubjectFields()"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        >
          <option value="user" {% if selected_subject_type == "user" %}selected{% endif %}>User</option>
          <option value="group" {% if selected_subject_type == "group" %}selected{% endif %}>Group</option>
        </select>
        <p class="mt-1 text-xs text-slate-500">
          Select one subject for this policy.
        </p>
      </div>

      <div id="policy-user-field">
        <label class="block text-sm text-slate-300 mb-1">User</label>
        <select
          id="policy-user-id"
          name="user_id"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        >
          <option value="">Select user</option>
          {% for user in users %}
          <option value="{{ user.id }}" {% if policy and policy.user_id == user.id %}selected{% endif %}>
            {{ user.label }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div id="policy-group-field">
        <label class="block text-sm text-slate-300 mb-1">Group</label>
        <select
          id="policy-group-id"
          name="group_id"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        >
          <option value="">Select group</option>
          {% for group in groups %}
          <option value="{{ group.id }}" {% if policy and policy.group_id == group.id %}selected{% endif %}>
            {{ group.label }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm text-slate-300 mb-1">Resource</label>
        <select
          name="resource_id"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
          required
        >
          <option value="">Select resource</option>
          {% for resource in resources %}
          <option value="{{ resource.id }}" {% if policy and policy.resource_id == resource.id %}selected{% endif %}>
            {{ resource.name }} ({{ resource.resource_type }})
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-slate-300 mb-1">Effect</label>
          <select
            name="effect"
            class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
          >
            <option value="allow" {% if not policy or policy.effect == "allow" %}selected{% endif %}>allow</option>
            <option value="deny" {% if policy and policy.effect == "deny" %}selected{% endif %}>deny</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-slate-300 mb-1">Priority</label>
          <input
            type="number"
            name="priority"
            value="{{ policy.priority if policy else 100 }}"
            class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
            min="1"
            required
          />
        </div>
      </div>

      <div>
        <label class="block text-sm text-slate-300 mb-1">Conditions</label>
        <textarea
          name="conditions"
          rows="3"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
          placeholder='{"os_name":"Windows","time_range":"08:00-18:00"}'
        >{{ policy.conditions if policy else '' }}</textarea>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-800">
        <button
          type="button"
          class="px-3 py-2 rounded-md bg-slate-800 text-slate-200 text-sm hover:bg-slate-700"
          onclick="document.getElementById('modal-root').innerHTML='';"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="px-3 py-2 rounded-md bg-sky-600 text-white text-sm hover:bg-sky-500"
        >
          {{ submit_label }}
        </button>
      </div>
    </form>

    <script>
      function togglePolicySubjectFields() {
        var type = document.getElementById("policy-subject-type").value;
        var userField = document.getElementById("policy-user-field");
        var groupField = document.getElementById("policy-group-field");
        var userSelect = document.getElementById("policy-user-id");
        var groupSelect = document.getElementById("policy-group-id");

        var isUser = type === "user";
        userField.style.display = isUser ? "block" : "none";
        groupField.style.display = isUser ? "none" : "block";

        userSelect.disabled = !isUser;
        userSelect.required = isUser;
        groupSelect.disabled = isUser;
        groupSelect.required = !isUser;
      }

      togglePolicySubjectFields();
    </script>
    </div>
  </div>
</div>
