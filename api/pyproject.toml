[project]
name = "vpnztna-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "cryptography>=43.0",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
