server {
    server_name vpn-ztna.ru www.vpn-ztna.ru;

    # Do not expose API documentation or Prometheus metrics publicly.
    location = /docs {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    # Baseline browser hardening. CSP is deferred because the public
    # policy portal currently uses inline scripts and styles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vpn-ztna.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vpn-ztna.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.vpn-ztna.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = vpn-ztna.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name vpn-ztna.ru www.vpn-ztna.ru;
    return 404; # managed by Certbot




}
