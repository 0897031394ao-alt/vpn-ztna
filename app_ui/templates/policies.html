{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <div>
    <h1 class="text-xl font-semibold text-slate-100">Policies</h1>
    <p class="text-sm text-slate-400 mt-1">Bind users or groups to resources with allow/deny rules.</p>
  </div>

  <button
    class="px-3 py-2 rounded-md bg-sky-600 text-white text-sm hover:bg-sky-500"
    hx-get="/ui/policies/new"
    hx-target="#policy-form-panel"
    hx-swap="innerHTML"
  >
    New policy
  </button>
</div>

<div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
  <section class="xl:col-span-2">
    <div
      id="policies-table"
      hx-get="/ui/policies/table"
      hx-trigger="load"
      hx-target="#policies-table"
      hx-swap="innerHTML"
    >
      <div class="text-sm text-slate-400">Loading policies...</div>
    </div>
  </section>

  <aside
    id="policy-form-panel"
    class="rounded-xl border border-slate-800 bg-slate-900/60 p-4 min-h-[320px]"
  >
    <div class="text-sm text-slate-400">
      Select “New policy” or “Edit” to open the form here.
    </div>
  </aside>
</div>
{% endblock %}
