{% extends "base.html" %}

{% block content %}
<div class="flex items-start justify-between mb-4 gap-4">
  <div>
    <h1 class="text-xl font-semibold text-slate-100">Policies</h1>
    <p class="text-sm text-slate-400 mt-1">Bind users or groups to resources with allow/deny rules.</p>
  </div>

  <button
    class="inline-flex items-center rounded-lg bg-cyan-600 px-4 py-2 text-sm font-medium text-white hover:bg-cyan-500"
    hx-get="/ui/policies/new"
    hx-target="#modal-root"
    hx-swap="innerHTML"
  >
    New policy
  </button>
</div>

<div>
  <section>
    <div
      id="policies-table"
      hx-get="/ui/policies/table"
      hx-trigger="load"
      hx-target="#policies-table"
      hx-swap="innerHTML"
    >
      <div class="text-sm text-slate-400">Loading policies...</div>
    </div>
  </section>
</div>

<div id="modal-root"></div>
{% endblock %}
