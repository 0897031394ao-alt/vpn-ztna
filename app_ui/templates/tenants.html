{% extends "base.html" %}

{% block content %}
<div class="flex items-start justify-between mb-4 gap-4">
  <div>
    <h1 class="text-xl font-semibold text-slate-100">Tenants</h1>
    <p class="text-sm text-slate-400 mt-1">Manage tenant records from the admin panel.</p>
  </div>

  <button
  class="inline-flex items-center rounded-lg bg-cyan-600 px-4 py-2 text-sm font-medium text-white hover:bg-cyan-500"
  hx-get="/ui/tenants/new?page=1&limit=20&status=active"
  hx-target="#modal-root"
  hx-swap="innerHTML"
>
  New tenant
</button>
</div>

<div class="w-full">
  <div
    id="tenants-table"
    class="w-full"
    hx-get="/ui/tenants/table?page=1&limit=20&status=active"
    hx-trigger="load"
    hx-target="#tenants-table"
    hx-swap="innerHTML"
  >
    <div class="text-sm text-slate-400">Loading tenants...</div>
  </div>
</div>

<div id="modal-root"></div>
{% endblock %}
