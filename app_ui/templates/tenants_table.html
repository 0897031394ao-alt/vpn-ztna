<div class="overflow-x-auto rounded-xl border border-slate-700">
  <table class="min-w-full text-sm text-slate-300">
    <thead class="bg-slate-800 text-xs uppercase tracking-wide text-slate-400">
      <tr>
        <th class="px-4 py-3 text-left">Name</th>
        <th class="px-4 py-3 text-left">Slug</th>
        <th class="px-4 py-3 text-left">Status</th>
        <th class="px-4 py-3 text-left">Created</th>
        <th class="px-4 py-3 text-left">Actions</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-700 bg-slate-900/40">
      {% for tenant in tenants %}
      <tr class="align-top transition-colors duration-150 hover:bg-slate-800/40">
        <td class="px-4 py-3 font-medium text-slate-100">
          {{ tenant.name }}
        </td>
        <td class="px-4 py-3 font-mono text-xs text-slate-300">
          {{ tenant.slug }}
        </td>
        <td class="px-4 py-3">
          <span class="rounded-full px-2 py-0.5 text-xs font-medium
            {% if tenant.is_active %}
              bg-emerald-900/50 text-emerald-400
            {% else %}
              bg-slate-700 text-slate-300
            {% endif %}">
            {% if tenant.is_active %}active{% else %}inactive{% endif %}
          </span>
        </td>
        <td class="px-4 py-3 text-xs text-slate-400 whitespace-nowrap">
          {{ tenant.created_at }}
        </td>
        <td class="px-4 py-3">
          <div class="flex flex-wrap gap-1.5">
            <!-- Edit в модальном окне -->
            <button
              hx-get="/ui/tenants/{{ tenant.id }}/edit"
              hx-target="#modal-root"
              hx-swap="innerHTML"
              class="rounded-md border border-cyan-700 bg-cyan-900/40 px-2 py-1 text-[11px] font-medium text-cyan-300 transition-colors duration-150 hover:bg-cyan-900"
            >
              Edit
            </button>

            <!-- Enable / Disable, таблица обновляется через tenants-table -->
            <button
              hx-post="/ui/tenants/{{ tenant.id }}/toggle"
              hx-target="#tenants-table"
              hx-swap="innerHTML"
              class="rounded-md border px-2 py-1 text-[11px] font-medium transition-colors duration-150
                {% if tenant.is_active %}
                  border-yellow-700 bg-yellow-900/50 text-yellow-300 hover:bg-yellow-900
                {% else %}
                  border-emerald-600 bg-emerald-700 text-white hover:bg-emerald-600
                {% endif %}"
            >
              {% if tenant.is_active %}Disable{% else %}Enable{% endif %}
            </button>

            <!-- Delete, таблица обновляется через tenants-table -->
            <button
              hx-post="/ui/tenants/{{ tenant.id }}/delete"
              hx-target="#tenants-table"
              hx-swap="innerHTML"
              hx-confirm="Delete tenant '{{ tenant.name }}'?"
              class="rounded-md border border-rose-700 bg-rose-900/40 px-2 py-1 text-[11px] font-medium text-rose-300 transition-colors duration-150 hover:bg-rose-900"
            >
              Delete
            </button>
          </div>
        </td>
      </tr>
      {% else %}
      <tr>
        <td colspan="5" class="px-4 py-6 text-center text-slate-500">
          No tenants yet.
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
