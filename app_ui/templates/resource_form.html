<div>
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold text-slate-100">{{ form_title }}</h2>
    <button
      class="text-xs text-slate-400 hover:text-white"
      hx-get="/ui/resources/new"
      hx-target="#resource-form-panel"
      hx-swap="innerHTML"
    >
      Reset
    </button>
  </div>
  {% if errors %}
  <div class="alert alert-error" style="margin-bottom: 16px; padding: 12px; border: 1px solid #d33; background: #fff5f5; color: #a00; border-radius: 8px;">
    <ul style="margin: 0; padding-left: 20px;">
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
{% endif %}
  <form
    class="space-y-4"
    hx-post="{{ form_action }}"
    hx-target="#resources-table"
    hx-target-4*="#resource-form-panel"
    hx-swap="innerHTML"
    hx-ext="response-targets"
  >
    <div>
      <label class="block text-sm text-slate-300 mb-1">Name</label>
      <input
        type="text"
        name="name"
        value="{{ resource.name if resource else '' }}"
        class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        placeholder="CRM subnet"
        required
      />
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Description</label>
      <textarea
        name="description"
        class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        rows="3"
        placeholder="Optional description"
      >{{ resource.description if resource else '' }}</textarea>
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Type</label>
      <select
        name="resource_type"
        class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        required
      >
        <option value="cidr" {% if resource and resource.resource_type == "cidr" %}selected{% endif %}>cidr</option>
        <option value="host" {% if resource and resource.resource_type == "host" %}selected{% endif %}>host</option>
        <option value="service" {% if resource and resource.resource_type == "service" %}selected{% endif %}>service</option>
      </select>
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Address</label>
      <input
        type="text"
        name="address"
        value="{{ resource.address if resource else '' }}"
        class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        placeholder="10.10.30.0/24 or app.internal.local"
        required
      />
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Ports</label>
      <input
        type="text"
        name="ports"
        value="{{ resource.ports if resource else '' }}"
        class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
        placeholder="443,8443"
      />
    </div>

    <div>
      <label class="block text-sm text-slate-300 mb-1">Protocol</label>
      <select
        name="protocol"
        class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-500"
      >
        <option value="any" {% if not resource or resource.protocol == "any" %}selected{% endif %}>any</option>
        <option value="tcp" {% if resource and resource.protocol == "tcp" %}selected{% endif %}>tcp</option>
        <option value="udp" {% if resource and resource.protocol == "udp" %}selected{% endif %}>udp</option>
        <option value="icmp" {% if resource and resource.protocol == "icmp" %}selected{% endif %}>icmp</option>
      </select>
    </div>

    <div class="flex items-center gap-2 pt-2">
      <button
        type="submit"
        class="px-3 py-2 rounded-md bg-sky-600 text-white text-sm hover:bg-sky-500"
      >
        {{ submit_label }}
      </button>

      <button
        type="button"
        class="px-3 py-2 rounded-md bg-slate-800 text-slate-200 text-sm hover:bg-slate-700"
        hx-get="/ui/resources/table"
        hx-target="#resources-table"
        hx-swap="innerHTML"
      >
        Refresh table
      </button>
    </div>
  </form>
</div>
