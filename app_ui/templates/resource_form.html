<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4">
  <div class="w-full max-w-2xl rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl">
    <div class="flex items-start justify-between border-b border-slate-800 px-6 py-5">
      <div>
        <h2 class="text-xl font-semibold text-slate-100">{{ form_title }}</h2>
        <p class="mt-1 text-sm text-slate-400">Manage internal resources and services available for policies.</p>
      </div>
      <button
        type="button"
        class="text-sm text-slate-400 hover:text-slate-200"
        onclick="document.getElementById('modal-root').innerHTML='';"
      >
        Close
      </button>
    </div>

    <form
      class="space-y-5 px-6 py-6"
      hx-post="{{ form_action }}"
      hx-target="#resources-table"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.xhr.status < 400){ document.getElementById('modal-root').innerHTML=''; }"
    >
      <input type="hidden" name="page" value="{{ page or 1 }}">
      <input type="hidden" name="limit" value="{{ limit or 20 }}">
      <input type="hidden" name="status" value="{{ status or 'active' }}">

      {% if error_message %}
      <div class="rounded-lg border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200">
        {{ error_message }}
      </div>
      {% endif %}

      <div>
        <label class="mb-1 block text-sm text-slate-300">Name</label>
        <input
          type="text"
          name="name"
          value="{{ resource.name if resource else '' }}"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-500"
          placeholder="CRM subnet"
          required
        />
      </div>

      <div>
        <label class="mb-1 block text-sm text-slate-300">Description</label>
        <textarea
          name="description"
          rows="3"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-500"
          placeholder="Optional description"
        >{{ resource.description if resource else '' }}</textarea>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm text-slate-300">Type</label>
          <select
            name="resource_type"
            class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-500"
            required
          >
            <option value="cidr" {% if resource and resource.resource_type == "cidr" %}selected{% endif %}>cidr</option>
            <option value="host" {% if resource and resource.resource_type == "host" %}selected{% endif %}>host</option>
            <option value="service" {% if resource and resource.resource_type == "service" %}selected{% endif %}>service</option>
          </select>
        </div>

        <div>
          <label class="mb-1 block text-sm text-slate-300">Protocol</label>
          <select
            name="protocol"
            class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-500"
          >
            <option value="any" {% if not resource or resource.protocol == "any" %}selected{% endif %}>any</option>
            <option value="tcp" {% if resource and resource.protocol == "tcp" %}selected{% endif %}>tcp</option>
            <option value="udp" {% if resource and resource.protocol == "udp" %}selected{% endif %}>udp</option>
            <option value="icmp" {% if resource and resource.protocol == "icmp" %}selected{% endif %}>icmp</option>
          </select>
        </div>
      </div>

      <div>
        <label class="mb-1 block text-sm text-slate-300">Address</label>
        <input
          type="text"
          name="address"
          value="{{ resource.address if resource else '' }}"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-500"
          placeholder="10.10.30.0/24 or app.internal.local"
          required
        />
      </div>

      <div>
        <label class="mb-1 block text-sm text-slate-300">Ports</label>
        <input
          type="text"
          name="ports"
          value="{{ resource.ports if resource else '' }}"
          class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-500"
          placeholder="443,8443"
        />
      </div>

      <div class="flex items-center justify-end gap-3 border-t border-slate-800 pt-4">
        <button
          type="button"
          class="rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-200 hover:bg-slate-800"
          onclick="document.getElementById('modal-root').innerHTML='';"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="rounded-lg bg-cyan-600 px-4 py-2 text-sm font-medium text-white hover:bg-cyan-500"
        >
          {{ submit_label }}
        </button>
      </div>
    </form>
  </div>
</div>
