<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>VPN-ZTNA Panel</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/htmx-ext-response-targets@2.0.2/response-targets.js"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 px-6 py-3 flex items-center justify-between">
      <div class="font-semibold text-slate-100">VPN-ZTNA Admin</div>
      <nav class="flex items-center gap-4 text-sm text-slate-300">
        <a href="/" class="hover:text-white">Peers</a>
        <a href="/tenants" class="hover:text-white">Tenants</a>
        <a href="/resources" class="hover:text-white">Resources</a>
        <a href="/policies" class="hover:text-white">Policies</a>
        <a href="/debug/access" class="hover:text-white">Debug Access</a>     
        <a href="/debug/check" class="hover:text-white">Debug Check</a>
        <a href="/debug/peer" class="hover:text-white">Debug Peer</a>
      </nav>
    </header>

    <main class="px-6 py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
